<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить артиста</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <a href="index.html" class="back-btn">←</a>
            <h1>Новый артист</h1>
            <div style="width: 40px;"></div>
        </header>

        <form id="artist-form" class="rate-form">
            <div class="input-group">
                <input type="text" id="name" placeholder="Имя артиста" required>
            </div>

            <div class="image-upload">
                <label class="upload-label" for="image-file">
                    <div id="image-preview" class="image-preview">
                        <span>📷</span>
                        <small>Нажми чтобы выбрать фото</small>
                    </div>
                </label>
                <input type="file" id="image-file" accept="image/*" hidden>
            </div>

            <button type="submit" class="btn-primary btn-save">Добавить артиста</button>
        </form>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/add-artist.js"></script>
</body>
</html>
